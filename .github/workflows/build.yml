name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowanie
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk Alfa-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlfaLauncher-apk
          path: Alfa-launcher.apk
      # Najnowsze APK zawsze pod tym samym adresem:
      # https://github.com/<właściciel>/<repo>/releases/latest/download/Alfa-launcher.apk
      - name: Wydanie z APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Alfa-launcher.apk \
            --title "Alfa – wersja ${{ github.run_number }}" \
            --notes "APK zbudowane automatycznie z commita ${{ github.sha }}." \
            --latest
